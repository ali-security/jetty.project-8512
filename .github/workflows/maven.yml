name: Java CI with Maven

on:
  push:
    branches: "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: |
        mvn -B test install -pl jetty-io
        mvn -B test install -pl jetty-server

    - name: Upload artifacts
      if: always() # Upload artifacts even if tests fail, useful for debugging
      uses: actions/upload-artifact@v4
      with:
        name: maven-target-artifacts
        path: '**/target/**'
